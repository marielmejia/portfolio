<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video test</title>
<!-- Temporary page for checking the hero video on a phone: plain videos with no effects, plus what the browser reports -->
<style>
  body { margin: 0; padding: 16px; font: 15px/1.4 -apple-system, system-ui, sans-serif; background: #fff; color: #222; }
  h2 { font-size: 15px; margin: 20px 0 6px; }
  video { display: block; width: 100%; height: auto; background: #f0f; }
  pre { white-space: pre-wrap; background: #f3f3f3; padding: 8px; font-size: 12px; }
</style>
<h2>A. Sequence 01 web.mp4 (plain)</h2>
<video id="a" src="work/Sequence%2001%20web.mp4" autoplay muted loop playsinline preload="auto"></video>
<pre id="a-log"></pre>
<h2>B. Sequence 01.mp4 (original, plain)</h2>
<video id="b" src="work/Sequence%2001.mp4" autoplay muted loop playsinline preload="auto"></video>
<pre id="b-log"></pre>
<h2>C. Sequence 01 web.mp4 with the hero's grayscale filter</h2>
<video id="c" src="work/Sequence%2001%20web.mp4" autoplay muted loop playsinline preload="auto" style="filter: grayscale(1)"></video>
<pre id="c-log"></pre>
<h2>Browser</h2>
<pre id="env"></pre>
<script>
  document.getElementById('env').textContent = navigator.userAgent +
    '\nmp4 avc1.4D4028: ' + document.createElement('video').canPlayType('video/mp4; codecs="avc1.4D4028"');
  ['a', 'b', 'c'].forEach(id => {
    const v = document.getElementById(id), log = document.getElementById(id + '-log');
    const events = [];
    ['loadedmetadata', 'loadeddata', 'canplay', 'playing', 'pause', 'stalled', 'suspend', 'waiting', 'error'].forEach(t =>
      v.addEventListener(t, () => { events.push(t); }));
    const show = () => {
      log.textContent = 'paused: ' + v.paused + '   time: ' + v.currentTime.toFixed(1) + 's' +
        '\nreadyState: ' + v.readyState + '   networkState: ' + v.networkState +
        '\nerror: ' + (v.error ? v.error.code + ' ' + v.error.message : 'none') +
        '\nsize: ' + v.videoWidth + '×' + v.videoHeight +
        '\nevents: ' + events.join(', ');
    };
    setInterval(show, 500); show();
  });
  addEventListener('error', e => { document.getElementById('env').textContent += '\nscript error: ' + e.message; });
</script>
